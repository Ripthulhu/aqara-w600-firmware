<text x="65" y="677" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#536777" text-anchor="start">H/L describe the energized or sampling segment; TIM4 bounds the drive pulses in the replacement firmware.</text>
<text x="65" y="694" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#536777" text-anchor="start">With equal 91-kohm resistors, PB13 is approximately (V(M_RED) + V(M_BLACK)) / 2 before ADC loading.</text>
<text x="65" y="711" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#536777" text-anchor="start">The selected grounded terminal makes the off-drive sample useful for back-EMF sensing. This is not a current shunt.</text>
<text x="65" y="728" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#536777" text-anchor="start">Recorded unloaded peaks: DIR1 -3.302 V; DIR2 +3.308 V. These are meter captures, not full waveforms.</text>
