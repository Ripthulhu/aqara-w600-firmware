<text x="70" y="625" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#536777" text-anchor="start">D1 and D2 share their anodes. Their banded cathodes go to BAT+ and Q5 source respectively.</text>
<text x="70" y="642" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#536777" text-anchor="start">Q5: lower-left = gate, lower-right = source, single upper leg = drain. R28 is the gate-source pull-up.</text>
<text x="70" y="659" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#536777" text-anchor="start">The diode pair is not a simple series battery feed. Its shared-anode node and the remaining supply circuit need tracing.</text>
