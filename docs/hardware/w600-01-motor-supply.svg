<text x="85" y="722" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#99651c" text-anchor="start">Identified from the photographs and circuit</text>
<text x="85" y="742" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#99651c" text-anchor="start">Diode polarity is assigned. Q5 matches the 2305 P-MOS pinout; the exact diode types and transistor manufacturer remain unconfirmed.</text>
