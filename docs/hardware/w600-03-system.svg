<text x="355" y="507" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" fill="#203344" text-anchor="middle">PA1 / 12 ADC_IN0</text>
<polyline points="288,570 330,570 330,550 425,550" fill="none" stroke="#176586" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="355" y="590" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" fill="#203344" text-anchor="middle">PB9 / 48 control</text>
<rect x="425" y="620" width="713" height="120" fill="#f8fafb" stroke="#203344"/>
<text x="445" y="649" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#203344" text-anchor="start">Debug and supply connections</text>
<text x="445" y="674" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#203344" text-anchor="start">PA3 / lead 14 -&gt; pad P16: UART4 diagnostic TX, 9600 8N1.</text>
<text x="445" y="692" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#203344" text-anchor="start">NRST / lead 9 -&gt; pad P12: active-low reset. P29 was a rejected candidate.</text>
<text x="445" y="710" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#203344" text-anchor="start">PA13 / lead 36: SWDIO. PA14 / lead 37: SWCLK. G pad: common ground.</text>
<text x="445" y="728" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#203344" text-anchor="start">C15 connects MCU lead 30 (VDD/VDDA) to lead 31 (VSS/VSSA); capacitance unknown.</text>
<text x="60" y="663" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#536777" text-anchor="start">PA4 / 15, PA5 / 16, PB0 / 19:</text>
<text x="60" y="680" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#536777" text-anchor="start">display / power-group control in code.</text>
<text x="60" y="697" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#536777" text-anchor="start">Complete rail connections remain untraced.</text>
