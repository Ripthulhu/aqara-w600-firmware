<text x="174" y="521" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#203344" text-anchor="middle">Temperature front-end</text>
<text x="174" y="546" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" fill="#536777" text-anchor="middle">Resistor / sensor topology untraced</text>
