<text x="42" y="79" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#203344" text-anchor="start">Controller, radio, display and debug</text>
<text x="42" y="103" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#536777" text-anchor="start">Blue dashed links are established from firmware and functional tests; exact radio/display device-side pad numbers remain untraced.</text>
