<text x="817" y="492" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" fill="#203344" text-anchor="middle">PB6 / 45 UART2 TX</text>
<text x="817" y="528" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" fill="#203344" text-anchor="middle">19200, 8O1; open-drain</text>
