name: Native tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/test_native.py
      - run: python3 firmware/test_ota_image.py
      - run: python3 tools/test_package_ota.py
      - run: python3 tools/test_package_release.py
      - run: python3 tools/test_bundle_converter.py
      - run: node --test zigbee2mqtt/test_w600_reference.mjs
